[package]
name = "processing"
version = "0.0.9-alpha.5"
edition = "2024"
autoexamples = false

[lints]
workspace = true

[features]
default = ["wayland", "x11"]
wayland = ["processing_render/wayland"]
x11 = ["processing_render/x11"]
# TEMP(bevy-020): nannou_webcam pins bevy 0.19
# webcam = ["dep:processing_webcam"]
cuda = ["dep:processing_cuda", "processing_cuda/cuda"]

[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# TEMP(bevy-020): midi/audio pin bevy 0.19
# TEMP(bevy-020): nannou_webcam pins bevy 0.19
exclude = ["crates/processing_audio", "crates/processing_midi", "crates/processing_webcam"]

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
bevy = { git = "https://github.com/processing/bevy", branch = "processing-batches", default-features = false, features = [
  # 2d
  "2d_bevy_render",
  "default_app",
  "picking",
  "scene",

  # 3d
  "3d_bevy_render",

  # glTF textures and load_image() are often JPEG
  "jpeg",

  # ui
  "ui_api",
  "ui_bevy_render",

  # default_platform
  "android-game-activity",
  "bevy_gilrs",
  "bevy_winit",
  "default_font",
  "multi_threaded",
  "std",
  "sysinfo_plugin",
  "wayland",
  "webgl2",
  "x11",
  "free_camera",
  "pan_camera",
  
] }
bevy_naga_reflect = { git = "https://github.com/tychedelia/bevy_naga_reflect", branch = "bevy-020-fixes" }
bevy_cuda = { git = "https://github.com/tychedelia/bevy_cuda" }
naga = { version = "29", features = ["wgsl-in"] }
wesl = { version = "0.3", default-features = false }
pyo3 = { git = "https://github.com/PyO3/pyo3", branch = "main" }
pyo3-introspection = { git = "https://github.com/PyO3/pyo3", branch = "main" }
processing = { path = "." }
processing_core = { path = "crates/processing_core" }
processing_cuda = { path = "crates/processing_cuda" }
processing_pyo3 = { path = "crates/processing_pyo3" }
processing_render = { path = "crates/processing_render" }
# TEMP(bevy-020): midi/audio pin bevy 0.19
# processing_midi = { path = "crates/processing_midi" }
# processing_audio = { path = "crates/processing_audio" }
processing_input = { path = "crates/processing_input" }
processing_glfw = { path = "crates/processing_glfw" }
# TEMP(bevy-020): nannou_webcam pins bevy 0.19
# processing_webcam = { path = "crates/processing_webcam" }
rand = "0.10"
rand_distr = "0.6"

[dependencies]
bevy = { workspace = true }
processing_core = { workspace = true }
processing_render = { workspace = true }
# TEMP(bevy-020)
# processing_midi = { workspace = true }
# processing_audio = { workspace = true }
processing_input = { workspace = true }
# TEMP(bevy-020)
# processing_webcam = { workspace = true, optional = true }
processing_cuda = { workspace = true, optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
processing_glfw = { workspace = true }
rand = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
processing_glfw = { workspace = true, features = ["wayland", "x11"] }

## TODO: Remove these patches once we've moved back to depending on upstream bevy
[patch."https://github.com/bevyengine/bevy"]
bevy = { git = "https://github.com/processing/bevy", branch = "processing-batches" }

[patch.crates-io]
bevy = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
# bevy_seedling depends on bevy sub-crates directly, so they must be patched too
bevy_app = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_asset = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_diagnostic = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_ecs = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_log = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_math = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_platform = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_reflect = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_time = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_transform = { git = "https://github.com/processing/bevy", branch = "processing-batches" }
bevy_utils = { git = "https://github.com/processing/bevy", branch = "processing-batches" }

