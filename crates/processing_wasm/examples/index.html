<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Processing</title>
    <style>
        body { margin: 0; min-height: 100vh; background: #1a1a1a; color: #ccc;
               display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 12px; }
        canvas { border: 1px solid #333; }
    </style>
</head>
<body>
    <select id="example">
        <option>background_image</option>
        <option>translate</option>
        <option>mouse_2d</option>
    </select>
    <canvas></canvas>
    <script type="module">
        const select = document.getElementById('example');
        select.value = new URLSearchParams(location.search).get('example') ?? select.options[0].value;
        select.onchange = () => (location.search = `?example=${select.value}`);

        // the sketch is a plain script that defines setup() and draw()
        const sketch = document.createElement('script');
        sketch.src = `${select.value}.js`;
        sketch.onload = () => import('./processing.js');
        document.head.append(sketch);
    </script>
</body>
</html>
