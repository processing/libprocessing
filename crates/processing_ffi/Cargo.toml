[package]
name = "processing_ffi"
version = "0.0.5"
edition = "2024"

[lints]
workspace = true

[lib]
name = "processing"
crate-type = ["cdylib", "staticlib"]

[features]
default = []
wayland = ["processing/wayland"]
x11 = ["processing/x11"]
webcam = ["processing/webcam"]
cuda = ["processing/cuda"]

[dependencies]
processing = { workspace = true }
bevy = { workspace = true }
half = "2.7"

[build-dependencies]
cbindgen = "0.29"
