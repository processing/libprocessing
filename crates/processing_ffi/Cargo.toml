[package]
name = "processing_ffi"
version = "0.0.5"
edition = "2024"

[lints]
workspace = true

[lib]
name = "processing"
crate-type = ["cdylib", "staticlib"]

[features]
default = ["video"]
wayland = ["processing/wayland"]
x11 = ["processing/x11"]
webcam = ["processing/webcam"]
cuda = ["processing/cuda"]
video = ["processing/video", "dep:processing_video"]

[dependencies]
processing = { workspace = true }
processing_video = { workspace = true, optional = true }
bevy = { workspace = true }
half = "2.7"

[build-dependencies]
cbindgen = "0.29"
